<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Database Admin Gateway</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full">
        <h1 class="text-2xl font-bold mb-2 text-slate-800 text-center">Admin Access</h1>
        <p class="text-sm text-slate-500 mb-6 text-center">Enter your administrator credentials.</p>
        
        <div id="errorAlert" class="hidden bg-red-100 text-red-700 text-sm p-3 rounded mb-4 font-medium text-center">
            Invalid username or password.
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Username</label>
                <input type="text" id="username" required class="w-full border border-gray-300 p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="password" required class="w-full border border-gray-300 p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors text-sm">
                Login
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');

            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();
            if (data.success) {
                window.location.href = '/admin.html';
            } else {
                errorAlert.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
