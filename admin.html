<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MongoDB Admin Console</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6 md:p-12">
    <div class="max-w-5xl mx-auto">
        
        <!-- Header Bar -->
        <header class="flex justify-between items-center mb-8 border-b pb-4 border-gray-200">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Database Workspace</h1>
                <p class="text-sm text-gray-500">Active Identity: <span id="adminName" class="font-bold text-gray-700">Loading...</span></p>
            </div>
            <a href="/auth/logout" class="bg-white border text-sm font-semibold border-gray-300 text-gray-700 px-4 py-2 rounded-lg shadow-sm hover:bg-gray-50 transition">Sign Out</a>
        </header>
        
        <!-- Structural Split Workspaces -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Left Side: Add Record Form -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Insert Document</h2>
                <form id="dataForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Name Element</label>
                        <input type="text" id="nameInput" required class="w-full border border-gray-300 p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Functional Designation / Role</label>
                        <input type="text" id="roleInput" required class="w-full border border-gray-300 p-2.5 rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm py-2.5 rounded-lg shadow-sm transition">Commit Document</button>
                </form>
            </div>

            <!-- Right Side: Collection Table Records Output -->
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 mb-4">Collection Cluster Records</h2>
                <div class="overflow-x-auto">
                    <ul id="dataContainer" class="divide-y divide-gray-100">
                        <!-- Items rendered asynchronously here -->
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
